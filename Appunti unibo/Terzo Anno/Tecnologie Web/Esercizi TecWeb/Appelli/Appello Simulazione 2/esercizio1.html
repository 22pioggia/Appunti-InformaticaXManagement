<!DOCTYPE html>
<html>
    <head>
        <title>Calcola il tuo preventivo e prenota</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrizione</th>
                        <th>Prezzo <br> (giornaliero)</th>
                        <th>Disponibilità</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Standard</td>
                        <td>Ombrellone con due lettini</td>
                        <td>20 €</td>
                        <td><img src="http://diiorio.nws.cs.unibo.it/twe/resources/2406a/yes.png" alt="yes"></td>
                    </tr>

                    <tr>
                        <td>Love Dogs</td>
                        <td>Standard, due lettini e spazio dedicato al tuo cane</td>
                        <td>40 €</td>
                        <td><img src="http://diiorio.nws.cs.unibo.it/twe/resources/2406a/yes.png" alt="yes"></td>
                    </tr>

                    <tr>
                        <td>Primissima</td>
                        <td>Prima fila, formato capanna, tre posti</td>
                        <td>50 €</td>
                        <td><img src="http://diiorio.nws.cs.unibo.it/twe/resources/2406a/no.png" alt="no"></td>
                    </tr>
                </tbody>
            </table>

            <h1>Calcola il tuo preventivo e prenota!</h1>

            <div>
                <form action="?" method="POST">
                    <span>Postazione: </span>
                    <select>
                        <option>Standard</option>
                        <option>Love Dogs</option>
                    </select>
                    
                    <span>Giorni: </span>
                    <select>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                    </select>

                    <span>Cliente: </span>
                    <input type="text">

                    <button type="submit">Prenota</button>
                </form>

                <p>160 €</p>
            </div>
        </main>
    </body>
</html>
